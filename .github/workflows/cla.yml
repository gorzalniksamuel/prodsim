name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, closed]

# Least privilege for the action: signatures are committed to a branch, the bot comments on
# the PR and sets a commit status. Never check out or run PR code in this workflow.
permissions:
  contents: write
  pull-requests: write
  actions: write
  statuses: write

jobs:
  cla:
    name: cla
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the ProdSim CLA and I hereby sign it.'))
    steps:
      - name: CLA Assistant
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/gorzalniksamuel/prodsim/blob/main/CLA.md
          branch: cla-signatures
          allowlist: gorzalniksamuel,dependabot[bot]
          custom-pr-sign-comment: I have read the ProdSim CLA and I hereby sign it.
