name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_LOCKED: "1"

jobs:
  repo-checks:
    name: repo-checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Repository file checks
        run: |
          bash scripts/check-private-files.sh
          bash scripts/check-repo-files.sh
      - name: Script tests
        run: |
          for t in scripts/tests/*.sh; do
            echo "==> $t"
            bash "$t"
          done

  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install dependencies
        run: uv sync --locked
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format
        run: uv run ruff format --check .
      - name: pyright
        run: uv run pyright
      - name: pytest (unit and integration; integration uses testcontainers/Docker)
        run: uv run pytest

  web:
    name: web
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install backend environment (needed by api:check)
        run: uv sync --locked --project ../../backend
      - name: Install web dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Generated API client is up to date
        run: npm run api:check

  licenses:
    name: licenses
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Collect Python production licenses
        working-directory: backend
        run: |
          uv run --no-dev --with 'pip-licenses==5.5.5' pip-licenses \
            --format=json --from=mixed --ignore-packages prodsim \
            > "$RUNNER_TEMP/python-licenses.json"
      - name: Collect web production licenses
        working-directory: apps/web
        run: |
          npm ci
          npx --no-install license-checker-rseidelsohn \
            --production --excludePrivatePackages --json \
            > "$RUNNER_TEMP/node-licenses.json"
      - name: License gate (no GPL/AGPL; LGPL only if allowlisted)
        run: |
          bash scripts/license-gate.sh \
            --python "$RUNNER_TEMP/python-licenses.json" \
            --node "$RUNNER_TEMP/node-licenses.json"

  compose-e2e:
    name: compose-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Build images, start the stack and run the smoke test
        run: scripts/smoke.sh
      - name: Install Playwright dependencies
        working-directory: apps/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Playwright e2e
        working-directory: apps/web
        run: npm run e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
      - name: Stack logs on failure
        if: failure()
        run: docker compose -f deploy/compose/compose.yaml logs --tail=200
      - name: Tear down the stack
        if: always()
        run: docker compose -f deploy/compose/compose.yaml down -v --remove-orphans
