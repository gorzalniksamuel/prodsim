[project]
name = "prodsim"
version = "0.1.0.dev0"
description = "ProdSim backend: industrial simulation, scheduling and analytics API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "pydantic-settings",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "httpx",
    "pyright",
    "pytest",
    "pytest-asyncio",
    "ruff",
    "testcontainers[postgres,redis]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prodsim"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.pyright]
include = ["src"]
strict = ["src"]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["error"]
